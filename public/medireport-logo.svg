<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#18103c" />
      <stop offset="100%" stop-color="#050515" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Box Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#logo-bg)" stroke="url(#logo-glow)" stroke-width="2.5" />

  <!-- Medical Cross Shape with Rounded Corners -->
  <g filter="url(#glow-filter)" fill="url(#logo-glow)">
    <!-- Vertical Bar -->
    <rect x="42" y="24" width="16" height="52" rx="8" />
    <!-- Horizontal Bar -->
    <rect x="24" y="42" width="52" height="16" rx="8" />
  </g>

  <!-- AI Neural Circuit Pulse Overlay -->
  <path d="M 20 50 L 34 50 L 42 34 L 50 66 L 58 40 L 66 50 L 80 50" 
        fill="none" 
        stroke="url(#pulse-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing Neural Nodes -->
  <circle cx="42" cy="34" r="3.5" fill="#67e8f9" />
  <circle cx="50" cy="66" r="3.5" fill="#c084fc" />
  <circle cx="58" cy="40" r="3.5" fill="#f472b6" />
</svg>
